[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "br-plc-toolchain"
version = "0.12.0"
description = "B&R Automation Studio development, verification, and runtime PVI toolchain"
requires-python = ">=3.10"
dependencies = ["mcp>=1.28,<2", "pvipy==1.2.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/br_plc_toolchain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
